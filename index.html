<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080c1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Piano Trainer" />
    <meta
      name="description"
      content="Impara a leggere le note sul pentagramma con ripetizione spaziata, canzoncine e allenamento alla lettura a prima vista."
    />
    <title>Piano Trainer — leggere le note</title>
    <script>
      // Applica il tema salvato prima del primo disegno, per non vedere il
      // lampo bianco/nero al caricamento.
      try {
        var saved = JSON.parse(localStorage.getItem('piano-trainer-v2') || '{}');
        var theme = (saved.settings && saved.settings.theme) || 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
